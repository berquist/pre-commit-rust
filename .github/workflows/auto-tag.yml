---
name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

permissions: {}

jobs:
  release:
    name: Create release
    runs-on: ubuntu-26.04
    steps:
      - id: compute_tag
        uses: craig-day/compute-tag@4f6e20dc9d852441c4e61a4b3ccadde9511f35f3 # v20
        with:
          github_token: ${{ github.token }}
          version_scheme: continuous
          version_type: major

